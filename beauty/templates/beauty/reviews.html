<!DOCTYPE html>
<html>
<head>
    <title>Отзывы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>Отзывы</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Отправить
        </button>
    </form>

    <hr>

    {% for review in reviews %}
        <div class="card mb-3">
            <div class="card-body">

                <h5>{{ review.client.username }}</h5>
                <p>{{ review.text }}</p>
                <p>Оценка: {{ review.rating }}/5</p>

            </div>
        </div>
    {% endfor %}

</div>

</body>
</html>
