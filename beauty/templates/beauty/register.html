{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <title>Регистрация</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body class="auth-body">

<div class="auth-overlay">

    <div class="auth-card">

        <a href="/login/" class="back-btn">
            ← Назад
        </a>

        <h2 class="auth-title">
            Регистрация
        </h2>

        <form method="post">

            {% csrf_token %}

            {% for field in form %}

                <div class="mb-3">

                    <label class="form-label text-light">

                        {{ field.label }}

                    </label>

                    {{ field }}

                    {% if field.errors %}

                        <div class="text-danger mt-2">

                            {{ field.errors }}

                        </div>

                    {% endif %}

                </div>

            {% endfor %}

            <button type="submit" class="btn btn-gold w-100">
                Зарегистрироваться
            </button>

        </form>

        <div class="auth-link">

            Уже есть аккаунт?

            <a href="/login/">
                Войти
            </a>

        </div>

    </div>

</div>

</body>
</html>
