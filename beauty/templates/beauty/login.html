{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Вход</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="auth-body">

<div class="auth-overlay">

    <div class="auth-card">

        <a href="/" class="back-btn">
            ← Назад
        </a>

        <h2 class="auth-title">
            Вход
        </h2>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-gold w-100">
                Войти
            </button>

        </form>

        <div class="auth-link">

            Нет аккаунта?

            <a href="/register/">
                Регистрация
            </a>

        </div>

    </div>

</div>

</body>
</html>
